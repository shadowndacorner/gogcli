name: arboreal-personal-google
description: Gmail, Calendar, Drive, Docs, Sheets, Contacts and account setup; no updater, generic API, MCP, or unrelated services.
allow:
  - version
  - schema
  - drive
  - gmail
  - calendar
  - docs
  - sheets
  - contacts
  - auth
  - config
deny:
  - auth.tokens.export
